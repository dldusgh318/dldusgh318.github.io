# 홈과 Projects 탭의 대표 프로젝트 카드
# 수치는 측정 조건과 함께 쓴다 (운영 성과와 로컬 실험을 구분)

- name: 청바지
  summary: 청년 정책 맞춤 추천 서비스
  role: Backend · 실서비스 운영
  hook: 외부 정책 데이터를 서비스 도메인으로 바꾸고, 느린 API는 DB까지 내려가 추적했습니다.
  metrics:
    - value: 634 → 178ms
      label: 최근 조회 API p95
    - value: 41 → 149 req/s
      label: 처리량
  note: 100K 이벤트 · 20 VUs 로컬 격리 벤치마크
  stack: [Spring Boot, MySQL, Grafana, AWS]

- name: 모앤디
  summary: 시술 모델–디자이너 매칭 서비스
  role: Backend Lead · 2025.10 ~ 2026.03
  hook: “커서 페이지네이션은 항상 오프셋보다 빠를까?”를 동점 반례와 실행계획으로 직접 검증했습니다.
  metrics:
    - value: 6/12 → 0
      label: 동점 데이터 누락 (id 커서 → 복합 커서)
    - value: 24.7 → 0.54ms
      label: 최신순 1,000페이지 SQL p50
  note: 100K 합성 데이터 · MySQL SQL 격리 실험
  stack: [Spring Boot, MySQL, S3, Lambda]

- name: 직행
  summary: 채용공고 통합 검색 서비스 · 기업 연계 프로젝트
  role: Backend · 기획 회의 참여 · 약 5주
  hook: 5주 동안 매일 기획·디자인·FE와 회의하며 기업의 요구사항을 동작하는 기능으로 바꿨습니다.
  metrics:
    - value: 공동 1위
      label: KUSITMS 기업 연계 최우수상
    - value: OAuth · JWT · TMAP
      label: 인증 구조와 통근시간 필터링
  stack: [Spring Boot, Kakao OAuth2, JWT, NCP]
